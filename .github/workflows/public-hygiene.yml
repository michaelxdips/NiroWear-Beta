name: Public landing safety
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  allowlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check exact public file allowlist and approved asset hashes
        run: python3 .github/check_public.py
