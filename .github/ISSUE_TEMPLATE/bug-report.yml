name: Beta bug report
description: Report a reproducible NiroWear beta problem without secrets.
body:
  - type: markdown
    attributes:
      value: "Never include API keys, Authorization headers, pairing codes, private conversation exports or unredacted secure-screen screenshots."
  - type: input
    id: watch
    attributes:
      label: Watch model and Wear OS version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NiroWear beta version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Optional nonsecret screenshot. Remove personal information first.
    validations:
      required: true
