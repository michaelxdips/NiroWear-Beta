name: Documentation or released-feature feedback
description: Suggest documentation fixes or improvements to existing released behavior.
body:
  - type: markdown
    attributes:
      value: |
        This request is public. Describe documentation or existing released behavior with a synthetic example, not private chat content. Suggestions do not imply accepted commitments or source access.
        Never include API keys, authentication headers, provider credentials, pairing codes, conversation exports or unredacted secure-screen captures. For security concerns, follow SECURITY.md; do not post exploit details here.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Which current documentation page or released control is unclear or difficult to use?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Watch use case
      description: When would this help, and how would you use it on a small round display?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Optional. Describe your preferred result and any current workaround.
  - type: input
    id: environment
    attributes:
      label: Watch model, Wear OS version and NiroWear version
      description: Optional. Include only nonsecret device/version details.
